:root {
  /* Frosted glass over the community page: light, slightly transparent tint of #00D6F6 */
  --tint: #00D6F6;
  --bg: #DEFAFE;
  --surface: rgba(255, 255, 255, .78);
  --surface-2: rgba(0, 214, 246, .10);
  --border: rgba(0, 214, 246, .28);
  --border-2: rgba(0, 170, 200, .38);
  --glass: blur(14px) saturate(1.3);
  --text: #111827;
  --text-2: #6B7280;
  --text-3: #9CA3AF;
  --about: #4B5563;
  --accent: #0060FF;
  --accent-ink: #0050D6;
  --accent-soft: #E5EFFF;
  --green: #16A34A;  --green-soft: #DCFCE7;
  --amber: #B45309;  --amber-soft: #FEF3C7;
  --shadow-sm: 0 1px 2px rgba(17,24,39,.04);
  --shadow: 0 1px 2px rgba(17,24,39,.04), 0 8px 24px -12px rgba(17,24,39,.12);
  --shadow-hover: 0 2px 4px rgba(17,24,39,.05), 0 16px 40px -16px rgba(17,24,39,.22);
  --shadow-lg: 0 32px 80px -24px rgba(17,24,39,.35), 0 0 0 1px rgba(17,24,39,.04);
  --font: "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-display: "Anton", "Arial Narrow", Impact, sans-serif;
  --sidebar: 250px;
  color-scheme: light only;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.5; min-height: 100vh; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.015em; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent-ink); }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }

/* ---------- Top bar ---------- */
:root { --bar: #0060FF; }   /* Lesko Help brand blue */
.topbar { position: sticky; top: 0; z-index: 30; background: var(--bar); color: #fff; }
.topbar-inner { max-width: 1180px; margin: 0 auto; padding: 0 clamp(16px, 3vw, 32px); height: 66px; display: flex; align-items: center; gap: 22px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; padding: 6px 10px 6px 0; border-radius: 10px; }
.brand-mark { width: 36px; height: 36px; border-radius: 10px; background: #fff; color: var(--bar); display: grid; place-items: center; }
.brand-mark svg { width: 22px; height: 22px; }
.brand-mark.has-img { background: #fff; padding: 0; overflow: hidden; box-shadow: 0 0 0 2px rgba(255,255,255,.9); }
.brand-mark.has-img img { width: 100%; height: 100%; display: block; object-fit: cover; }
.brand-word { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.nav { display: flex; gap: 2px; }
.nav-item { border: 0; background: transparent; color: var(--text-2); padding: 9px 13px; border-radius: 10px; font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item[aria-selected="true"] { background: var(--surface-2); color: var(--text); font-weight: 600; }
.badge { background: var(--accent); color: #fff; border-radius: 999px; min-width: 20px; height: 20px; padding: 0 6px; display: inline-grid; place-items: center; font-size: 12px; font-weight: 600; }
.search { margin-left: auto; display: flex; align-items: center; gap: 10px; background: #FFFFFF; border: 1px solid transparent; border-radius: 12px; padding: 0 8px 0 14px; height: 42px; color: var(--text-2); width: min(420px, 38vw); }
.search:focus-within { box-shadow: 0 0 0 4px rgba(255,255,255,.25); }
.search svg { flex: none; color: var(--text-3); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 15px; outline: none; color: var(--text); }
.search input::placeholder { color: var(--text-3); }
.search .clear { border: 0; background: transparent; color: var(--text-3); width: 28px; height: 28px; border-radius: 50%; font-size: 19px; line-height: 1; }
.search .clear:hover { background: var(--surface-2); color: var(--text); }
.btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 12px; padding: 10px 18px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; white-space: nowrap; box-shadow: var(--shadow-sm); transition: background .12s, border-color .12s; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-ink); }
.btn svg { width: 17px; height: 17px; }
.btn.small { padding: 8px 14px; font-size: 14px; border-radius: 10px; }
.btn[aria-pressed="true"] { background: #FFF6D1; border-color: #FDE58A; color: #7A5A00; }
.btn.star-btn svg { width: 20px; height: 20px; }
.btn.star-btn[aria-pressed="true"] svg { color: #FDCC0A; }

.page { max-width: 1180px; margin: 0 auto; padding: 22px clamp(16px, 3vw, 32px) 72px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.filterbar { margin-bottom: 22px; }

/* ---------- Filter bar: topic chips + view toggle ---------- */
.filterbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 9px; border: 1px solid rgba(255,255,255,.8); background: var(--surface); -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass); color: var(--text); border-radius: 999px; padding: 6px 14px 6px 6px; font-size: 15px; font-weight: 500; box-shadow: var(--shadow-sm); transition: border-color .12s, background .12s; }
.chip:hover { border-color: var(--border-2); }
.chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: #fff; }
.chip .swatch { width: 28px; height: 28px; border-radius: 50%; background: var(--grad, #111827); color: #fff; display: grid; place-items: center; flex: none; }
.chip .swatch svg { width: 17px; height: 17px; }
.chip .count { font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] .count { color: rgba(255,255,255,.7); }
.chip.static { cursor: default; box-shadow: none; padding-right: 12px; }
.chip.static .swatch { width: 26px; height: 26px; }

/* ---------- Sections ---------- */
.section-toggle { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 0; margin: 28px 0 14px; font-size: 22px; font-weight: 600; letter-spacing: -.015em; color: var(--text); }
.section-toggle .chev { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--text-3); transition: transform .15s; }
.section-toggle .chev svg { width: 18px; height: 18px; }
.section-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
.section-toggle:hover .chev { background: var(--surface-2); color: var(--text); }
.badge.yellow { background: #FDCC0A; color: #1F2937; }

.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 28px 0 16px; }
.section-head h2 { font-size: 22px; font-weight: 600; }
.section-head p { color: var(--text-2); margin-top: 2px; font-size: 15px; }
.section-head .link { color: var(--text-2); text-decoration: none; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; font-size: 16px; }
.section-head .link:hover { color: var(--text); }
.section-head .tools { display: flex; align-items: center; gap: 10px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow-sm); }
.seg button { border: 0; background: transparent; width: 38px; height: 34px; display: grid; place-items: center; color: var(--text-3); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button svg { width: 17px; height: 17px; }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); }

/* ---------- Cards ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; min-height: 300px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; transition: transform .14s, box-shadow .14s; position: relative; }
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.cover { height: 96px; background: var(--grad); position: relative; padding: 12px 14px; display: flex; align-items: flex-end; cursor: pointer; }
.cover .label { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.22); color: #fff; border-radius: 999px; padding: 5px 11px 5px 9px; font-size: 12.5px; font-weight: 600; backdrop-filter: blur(4px); }
.cover .label svg { width: 14px; height: 14px; }
.cover .star { position: absolute; top: 8px; right: 8px; border: 0; background: transparent; color: #fff; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; opacity: .85; }
.cover .star:hover { background: rgba(255,255,255,.2); opacity: 1; }
.cover .star svg { width: 18px; height: 18px; }
.cover .star[aria-pressed="true"] { opacity: 1; color: #FDCC0A; }
.card-body { padding: 14px 16px 14px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
.card .title-btn { all: unset; cursor: pointer; display: block; }
.card .title { font-size: 15px; font-weight: 600; line-height: 1.35; letter-spacing: -.01em; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .title-btn:hover .title { color: var(--accent-ink); }
.card .summary { font-style: italic; font-weight: 300; color: var(--text-3); }
.card .summary { font-size: 13px; color: var(--text-2); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 10px; font-size: 12.5px; color: var(--text-2); }
.card-meta .left { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.card-meta .left svg { width: 14px; height: 14px; color: var(--text-3); }
.card-meta .right { display: inline-flex; align-items: center; gap: 8px; }
.card-meta .right a { color: var(--text-2); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.card-meta .right a:hover { color: var(--text); }
.card-meta .right svg { width: 14px; height: 14px; }
.progress { height: 4px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 8px; }
.progress i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 999px; transition: width .2s; }
.card.is-done .progress i { width: 100%; }

.status { font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.status.done { background: var(--green-soft); color: var(--green); }
.status.saved { background: var(--amber-soft); color: var(--amber); }
.tag { font-size: 14px; padding: 5px 12px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }

/* group labels inside the list */
.group-label { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: var(--ink); margin: 14px 0 2px; grid-column: 1 / -1; }
.group-label:first-child { margin-top: 0; }
.group-label .swatch { width: 26px; height: 26px; border-radius: 50%; background: var(--grad); color: #fff; display: grid; place-items: center; }
.group-label .swatch svg { width: 15px; height: 15px; }

/* ---------- a lesson: the video, then the written steps ---------- */
.lesson { flex: 1; min-height: 0; overflow-y: auto; background: #F3F8FB; padding: 18px clamp(12px, 2vw, 20px) 36px; }
.lesson-video { position: relative; width: 100%; max-width: 780px; margin: 0 auto; aspect-ratio: 16 / 9; max-height: 400px; background: #0B1220; }
.lesson-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
.lesson-text { max-width: 74ch; margin: 0 auto; padding: 24px clamp(16px, 3vw, 28px) 0; }
.lb-h { font-size: 13px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--accent-ink); margin: 26px 0 8px; }
.lb-h:first-child { margin-top: 0; }
.lb-p { font-size: 15px; line-height: 1.6; color: var(--text); margin: 10px 0; }
.lesson-text a { color: var(--accent-ink); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.lesson-text a:hover { text-decoration-thickness: 2px; }
.lb-ul { margin: 10px 0; padding-left: 20px; display: grid; gap: 7px; }
.lb-ul li { font-size: 15px; line-height: 1.55; color: var(--text); }
.lb-ul li::marker { color: var(--accent); }
.lb-steps { list-style: none; margin: 14px 0; padding: 0; display: grid; gap: 9px; }
.lb-steps li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 13px; align-items: start;
  background: #fff; border: 1px solid #DCE8EE; border-radius: 12px; padding: 13px 16px; font-size: 15px; line-height: 1.55; }
.lb-num { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff;
  font-size: 12px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.lb-label { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--accent-ink); margin-bottom: 3px; }
.lb-note { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; margin: 16px 0;
  border-radius: 12px; padding: 13px 16px; font-size: 14.5px; line-height: 1.55; }
.lb-note p { margin: 0; }
.lb-badge { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.lb-note.tip { background: #FFF8E1; color: #6B5200; }
.lb-note.tip .lb-badge { background: #FDCC0A; color: #4A3800; }
.lb-note.warn { background: #FFEFF0; color: #8A1C25; }
.lb-note.warn .lb-badge { background: #F93946; color: #fff; }
.lb-note a { color: inherit; }
.lb-res { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--border); }
.lb-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.lb-chips a { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; text-decoration: none;
  color: var(--accent-ink); background: var(--accent-soft); border: 1px solid transparent; border-radius: 999px; padding: 6px 13px; }
.lb-chips a:hover { border-color: var(--accent); background: #fff; }
.lb-chips svg { width: 12px; height: 12px; }
@media (max-width: 640px) { .lesson-text { padding: 18px 16px 0; } .lb-steps li { grid-template-columns: 26px minmax(0,1fr); gap: 10px; padding: 12px 13px; } }

/* ---------- the state links page inside the viewer ---------- */
.links-page { flex: 1; min-height: 0; overflow-y: auto; padding: 18px clamp(14px, 3vw, 30px) 40px; background: #E7F1F6; }
.lp-nav { display: flex; flex-wrap: wrap; gap: 8px; position: sticky; top: 0; z-index: 2; background: #E7F1F6; padding: 4px 0 14px; }
.lp-nav button { --sec: var(--text-2); --sec-tint: #fff; border: 1px solid var(--sec); background: var(--sec-tint); color: var(--sec);
  border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
.lp-nav button:hover { background: var(--sec); color: #fff; }
.lp-nav button:hover .n { color: rgba(255,255,255,.85); }
.lp-nav .n { color: var(--sec); opacity: .7; font-weight: 600; font-variant-numeric: tabular-nums; }
.lp-nav button svg { width: 14px; height: 14px; }
.lp-nav button.is-saved { --sec: #A87F00; --sec-tint: #FFF6D6; }
.lp-sec { --sec: var(--accent); --sec-tint: var(--accent-soft); padding-top: 10px; scroll-margin-top: 54px; }
.lp-sec + .lp-sec { margin-top: 30px; }
.lp-saved { --sec: #A87F00; --sec-tint: #FFF6D6; }
.lp-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-bottom: 5px; border-bottom: 1px solid var(--sec); }
.lp-head h3 { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--sec); }
.lp-head h3 svg { width: 15px; height: 15px; }
.lp-head .n { font-size: 12.5px; font-weight: 600; color: var(--text-2); font-variant-numeric: tabular-nums; }
.lp-note { margin-top: 10px; font-size: 15px; font-weight: 500; color: var(--text); max-width: 68ch; }
.lp-intro { margin-top: 5px; font-size: 13.5px; font-style: italic; color: var(--about); max-width: 68ch; }
.lp-list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
.lp-list li { display: grid; grid-template-columns: 28px minmax(0, 1fr) 34px; gap: 12px; align-items: start;
  background: #fff; border: 1px solid #DCE8EE; border-radius: 12px; padding: 13px 14px 13px 16px; box-shadow: 0 1px 2px rgba(0,90,110,.05); }
.lp-list .num { width: 28px; height: 28px; border-radius: 50%; background: var(--sec); color: #fff;
  font-size: 12px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.lp-body { min-width: 0; }
.lp-tag { display: inline-block; margin-bottom: 5px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--sec); background: var(--sec-tint); border-radius: 999px; padding: 3px 9px; }
.lp-title { font-size: 15px; font-weight: 600; line-height: 1.35; color: var(--text); max-width: 72ch; }
.lp-sub { margin-top: 4px; font-size: 13px; line-height: 1.5; color: var(--about); max-width: 72ch; }
.lp-links { margin-top: 9px; display: flex; flex-wrap: wrap; gap: 7px; }
.lp-links a { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; text-decoration: none;
  color: var(--accent-ink); background: var(--accent-soft); border: 1px solid transparent; border-radius: 999px; padding: 5px 12px; }
.lp-links a:hover { border-color: var(--accent); background: #fff; }
.lp-links svg { width: 12px; height: 12px; }
.lp-star { width: 32px; height: 32px; margin-top: -2px; }
.lp-star svg { width: 21px; height: 21px; }
.lp-star[aria-pressed="true"] { color: #FDCC0A; }
.lp-empty { margin-top: 12px; font-size: 14px; color: var(--text-2); background: #fff; border: 1px dashed var(--border-2); border-radius: 12px; padding: 14px 16px; }
.lp-source { margin-top: 14px; font-size: 13px; }
.lp-source a { display: inline-flex; align-items: center; gap: 6px; color: var(--accent-ink); font-weight: 600; text-decoration: none; }
.lp-source a:hover { text-decoration: underline; }
.lp-source svg { width: 12px; height: 12px; }
.saved-pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #A87F00;
  background: #FFF6D6; border-radius: 999px; padding: 4px 9px; font-variant-numeric: tabular-nums; }
.saved-pill svg { width: 13px; height: 13px; color: #FDCC0A; }
@media (max-width: 640px) { .links-page { padding: 14px 14px 32px; } .lp-list li { grid-template-columns: 26px minmax(0, 1fr) 30px; gap: 9px; padding: 12px 11px 12px 13px; } }

/* ---------- Rows (Luma-style): coloured block with icon, title, subline ---------- */
.rows { display: grid; gap: 12px; }
.row { background: var(--surface); -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass); border: 1px solid rgba(255,255,255,.75); border-radius: 12px; box-shadow: 0 1px 2px rgba(0,90,110,.06), 0 6px 20px -10px rgba(0,90,110,.18); display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; align-items: center; overflow: hidden; transition: box-shadow .14s, transform .14s; }
.row:hover { box-shadow: 0 2px 4px rgba(17,24,39,.06), 0 14px 32px -14px rgba(17,24,39,.22); transform: translateY(-1px); }
.row .block { align-self: stretch; background: var(--grad); color: #fff; display: grid; place-items: center; cursor: pointer; min-height: 88px; }
.row .block svg { width: 38px; height: 38px; }
.row .block.state { position: relative; }
.row .block .code { font-family: var(--font-display); font-size: 34px; font-weight: 400; letter-spacing: .04em; line-height: 1; }
.row-main { padding: 16px 20px; min-width: 0; }
.row .title-btn { all: unset; cursor: pointer; display: block; max-width: 100%; }
.row .title { font-size: 15px; font-weight: 600; letter-spacing: .055em; text-transform: uppercase; line-height: 1.4; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.row .title-btn:hover .title { color: var(--accent-ink); }
.prefix { font-weight: 600; color: var(--text); }
.pipe { color: var(--text); margin: 0 9px; font-weight: 400; }
.row .about { font-size: 13.5px; font-style: italic; font-weight: 400; color: var(--about); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row .right { display: flex; align-items: center; gap: 4px; padding: 0 14px 0 8px; }

.icon-btn { border: 0; background: transparent; width: 34px; height: 34px; border-radius: 10px; display: inline-grid; place-items: center; color: var(--text-3); padding: 0; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn.star svg { width: 24px; height: 24px; }
.icon-btn.star[aria-pressed="true"] { color: #FDCC0A; }
.icon-btn.star[aria-pressed="true"]:hover { color: #E9BB00; }

.foot-note { margin-top: 24px; font-size: 14px; color: var(--text-3); }
.empty { grid-column: 1 / -1; padding: 56px 12px; text-align: center; color: var(--text-2); background: var(--surface); border: 1px dashed var(--border-2); border-radius: 18px; }
.empty h3 { font-size: 18px; color: var(--text); }
.empty p { margin-top: 6px; }

/* ---------- Viewer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(17,24,39,.4); backdrop-filter: blur(2px); z-index: 70; opacity: 0; transition: opacity .18s; }
.scrim.open { opacity: 1; }
.viewer { position: fixed; inset: 28px; margin: auto; max-width: 1200px; max-height: 840px; z-index: 80; background: #FFFFFF; border-radius: 22px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; overflow: hidden; opacity: 0; transform: translateY(10px) scale(.99); transition: opacity .18s, transform .18s; }
.viewer.open { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .viewer, .scrim, .card, .row { transition: none; } }
.viewer-head { display: flex; align-items: center; gap: 6px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--border); }
.viewer-title { display: inline-flex; align-items: center; gap: 12px; min-width: 0; font-size: 16px; font-weight: 500; }
.viewer-title .swatch { width: 32px; height: 32px; border-radius: 9px; background: var(--grad); color: #fff; display: grid; place-items: center; flex: none; }
.viewer-title .swatch svg { width: 18px; height: 18px; }
.viewer-title .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.viewer-actions { display: inline-flex; align-items: center; gap: 6px; margin-right: 6px; }
.viewer-head .spacer { flex: 1; }
.viewer-body { flex: 1; min-height: 0; display: flex; }
.stage { background: #EEF6F8; display: flex; flex-direction: column; min-height: 0; flex: 1; }
.stage-tabs { display: flex; gap: 4px; padding: 12px 14px; border-bottom: 1px solid var(--border); background: #FFFFFF; }
.stage-tabs button { border: 0; background: transparent; color: var(--text-2); padding: 7px 14px; border-radius: 999px; font-weight: 500; font-size: 14px; }
.stage-tabs button[aria-pressed="true"] { background: var(--text); color: #fff; }
.stage .media { flex: 1; min-height: 0; position: relative; }
.stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
.stage .media.video { flex: 1; background: #000; }
.stage .media.empty { display: grid; place-items: center; color: var(--text-2); font-size: 15px; padding: 24px; text-align: center; }
.stage .media.empty p { margin-bottom: 14px; }
.stage-note { padding: 9px 16px; font-size: 13px; color: var(--text-3); border-top: 1px solid var(--border); background: #FFFFFF; }
.detail { overflow: auto; padding: 26px 28px 32px; min-height: 0; }
.detail h2 { font-size: 20px; font-weight: 500; line-height: 1.35; outline: none; letter-spacing: 0; }
.detail .series { margin-top: 6px; font-size: 14px; color: var(--text-3); }
.detail .series a { color: var(--text-2); text-decoration: none; }
.detail .series a:hover { text-decoration: underline; }
.detail .summary { margin-top: 14px; font-size: 15px; color: var(--text-2); line-height: 1.6; }
.cta-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.section { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--border); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.section-title h3 { font-size: 15px; font-weight: 600; }
.hint { font-size: 13px; color: var(--text-3); }
.help { color: var(--text-3); font-size: 14px; margin-top: 6px; }
.links { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.links li { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.links li.checked { background: var(--green-soft); border-color: transparent; }
.links li.checked .label { color: var(--text-3); text-decoration: line-through; }
.check { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--border-2); background: var(--surface); display: grid; place-items: center; color: var(--surface); flex: none; padding: 0; }
.check[aria-checked="true"] { background: var(--green); border-color: var(--green); color: #fff; }
.check svg { width: 13px; height: 13px; }
.links .label { font-size: 15px; }
.links .label a { color: var(--text); text-decoration: none; }
.links .label a:hover { color: var(--accent-ink); text-decoration: underline; }
.links .host { font-size: 12.5px; color: var(--text-3); }
textarea.notes { width: 100%; margin-top: 12px; min-height: 100px; resize: vertical; border: 1px solid var(--border-2); border-radius: 12px; background: var(--surface); padding: 12px 14px; font-size: 15px; line-height: 1.5; }
textarea.notes:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 4px var(--accent-soft); }
.saved { font-size: 13px; color: var(--green); margin-top: 6px; min-height: 1.2em; }

/* ---------- Request form ---------- */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); padding: clamp(20px, 2.6vw, 30px); }
.two-col { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 36px; }
.form { display: grid; gap: 16px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 14px; font-weight: 600; }
.field input, .field textarea, .field .select { border: 1px solid var(--border-2); border-radius: 12px; background: var(--surface); padding: 12px 14px; font-size: 16px; width: 100%; }
.field textarea { min-height: 110px; resize: vertical; }
.field input:focus, .field textarea:focus, .field .select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 4px var(--accent-soft); }
.field .hint { font-size: 13px; }
.requests { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 10px; }
.requests li { border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; background: var(--surface-2); display: grid; gap: 4px; }
.requests .rq-title { font-weight: 600; font-size: 16px; }
.requests .rq-meta { font-size: 13px; color: var(--text-3); }
.requests .rq-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }

.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--text); color: #fff; padding: 11px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; z-index: 90; transition: opacity .2s, transform .2s; pointer-events: none; box-shadow: var(--shadow); }
.toast.show { opacity: 1; transform: translateX(-50%); }

/* ---------- Responsive ---------- */
@media (max-width: 1000px) {
  .viewer { inset: 0; border-radius: 0; max-height: none; }
  .viewer-title .t { display: none; }
  .viewer-actions .btn { padding: 8px 12px; }
  .two-col { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  .prefix { font-weight: 600; color: var(--text); }
.pipe { color: var(--text); margin: 0 9px; font-weight: 400; }
.row .about { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .topbar-inner { height: auto; flex-wrap: wrap; gap: 8px 14px; padding-top: 10px; padding-bottom: 10px; }
  .brand-word { display: none; }
  .nav-item { padding: 8px 10px; font-size: 14px; }
  .search { width: 100%; margin-left: 0; order: 10; }
  .page { padding-top: 16px; }
  .row { grid-template-columns: 60px minmax(0, 1fr) auto; }
  .row .block svg { width: 22px; height: 22px; }
  .row-main { padding: 12px 14px; }
  .row .title { white-space: normal; font-size: 15.5px; }
  .row .right { padding-right: 8px; }
}

@media print {
  .topbar, .filterbar, .viewer, .scrim, .toast, .icon-btn, .seg, footer { display: none !important; }
  .grid { display: block; }
  .card { box-shadow: none; border: 0; border-bottom: 1px solid #ccc; border-radius: 0; break-inside: avoid; }
  .cover { display: none; }
}

</style>

  const iconSvg = name => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ICONS.star}</svg>`;
  const TOPIC_STYLE = Object.fromEntries(TOPICS.map(t => [t.key, { grad: t.grad, tint: t.tint, ink: t.color, icon: iconSvg(t.icon) }]));
  const YELLOW = '#FDCC0A';
  const STORE_KEY = 'lesko-quick-guides-v2';

  const ITEMS = DATA.items.map(i => Object.assign({}, i, { hasPdf: !!i.download, hasVideo: !!i.video }));
  const byId = Object.fromEntries(ITEMS.map(i => [i.id, i]));

  /* ---------- storage ---------- */
  const store = load();
  function load() {
    const base = { bookmarks: {}, done: {}, notes: {}, checked: {}, saved: {}, requests: [], view: 'list', pinnedOpen: true };
    try { const raw = localStorage.getItem(STORE_KEY); return raw ? Object.assign(base, JSON.parse(raw)) : base; } catch (e) { return base; }
  }

  /* ---------- state ---------- */
  const state = { tab: 'library', topic: null, q: '', open: null, listIds: [], stage: 'read' };

  const $ = (sel, root) => (root || document).querySelector(sel);

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const host = url => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };
  const fmtDate = iso => { try { return new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); } catch (e) { return iso; } };
  const st = k => TOPIC_STYLE[k] || { grad: 'linear-gradient(135deg,#9CA3AF,#D1D5DB)', tint: '#F3F4F7', ink: '#6B7280', icon: '' };
  const styleVars = k => { const s = st(k); return `--grad:${s.grad};--tint:${s.tint};--ink:${s.ink}`; };
  const TOPIC_ORDER = Object.fromEntries(TOPICS.map((t, i) => [t.key, i]));
  const byTitle = (a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: 'base' });
  // Business first, then Nonprofit, then Career; alphabetical inside each topic.
  // Inside a topic: lessons first in their teaching order, then quick guides A to Z.
  const byTopicThenTitle = (a, b) => (TOPIC_ORDER[a.topic] - TOPIC_ORDER[b.topic])
    || ((b.isLesson ? 1 : 0) - (a.isLesson ? 1 : 0))
    || (a.isLesson && b.isLesson ? (a.lessonNo || a.order) - (b.lessonNo || b.order) : byTitle(a, b));
  const typeLabel = it => it.hasPdf && it.hasVideo ? "PDF · Video" : (it.hasPdf ? "PDF guide" : (it.hasVideo ? "Video lesson" : "Lesson"));
  // "LESSON 1 | Title" (numbered in teaching order inside the topic) or "QUICK GUIDE | Title"
  const LESSON_NO = {};
  TOPICS.forEach(t => ITEMS.filter(i => i.topic === t.key && i.isLesson).sort((x, y) => x.order - y.order).forEach((i, n) => { LESSON_NO[i.id] = n + 1; }));
  const prefix = it => it.kind === 'state' ? (TOPIC_BY_KEY[it.topic]?.label || 'State')
    : (it.isLesson ? `Lesson ${it.lessonNo || LESSON_NO[it.id] || ''}`.trim() : 'Quick guide');

  /* ---------- filtering (always alphabetical) ---------- */
  function filtered() {
    const q = state.q.trim().toLowerCase();
    const terms = q ? q.split(/\s+/) : [];
    return ITEMS.filter(it => {
      if (state.topic === 'bookmarked') { if (!store.bookmarks[it.id] && !savedCount(it.id)) return false; }
      else if (state.topic && it.topic !== state.topic) return false;
      if (terms.length) {
        const hay = it._hay || (it._hay = [it.title, it.summary, it.series, TOPIC_BY_KEY[it.topic]?.label,
          ...(it.links || []).map(l => l.label + ' ' + host(l.href)),
          ...(it.sections || []).flatMap(sec => [sec.label, ...sec.entries.map(e => e.title + ' ' + e.note)]),
          ...(it.body || []).map(b => b.text || b.html || (b.items || []).map(i => i.html || i.label || '').join(' '))
          ].join(' ').replace(/<[^>]+>/g, ' ').toLowerCase());
        if (!terms.every(t => hay.includes(t))) return false;
      }
      return true;
    }).sort(byTopicThenTitle);
  }

  /* ---------- render: topic chips ---------- */
  function renderTopics() {
    const marked = ITEMS.filter(i => store.bookmarks[i.id] || savedCount(i.id)).length;
    const all = `<button type="button" class="chip" data-topic="" aria-pressed="${!state.topic}"><span class="swatch" style="background:#111827">${ICON.grid}</span>All<span class="count">${ITEMS.length}</span></button>`;

    $('#topics').innerHTML = all + TOPICS.map(t => {
      const n = ITEMS.filter(i => i.topic === t.key).length;
      return `<button type="button" class="chip" data-topic="${t.key}" aria-pressed="${state.topic === t.key}" style="${styleVars(t.key)}">
        <span class="swatch">${st(t.key).icon}</span>${esc(t.label)}<span class="count">${n}</span></button>`;
    }).join('') + saved;
  }

  /* ---------- render: cards & rows ---------- */
  function statusHTML(it) {
    if (store.done[it.id]) return '<span class="status done">Done</span>';

  }
  function rowHTML(it) {
    const marked = !!store.bookmarks[it.id];
    return `<article class="row" data-id="${it.id}" style="${styleVars(it.topic)}">

      </div>

        ${savedCount(it.id) ? `<span class="saved-pill" title="Saved inside this state">${ICON.star}${savedCount(it.id)}</span>` : ''}
        ${it.hasPdf ? `<a class="icon-btn" href="${esc(it.download)}" target="_blank" rel="noopener" title="Download PDF" aria-label="Download PDF">${ICON.download}</a>` : ''}

      </div>
    </article>`;

  function renderInto(el, items, emptyHTML) {
    el.className = 'rows';

    items.forEach(it => {
      if (topicsShown.size > 1 && it.topic !== last) {
        const t = TOPIC_BY_KEY[it.topic] || {};
        html += `<div class="group-label" style="${styleVars(it.topic)}"><span class="swatch">${st(it.topic).icon}</span>${esc(t.label || '')}</div>`;
        last = it.topic;
      }
      html += rowHTML(it);
    });
    el.innerHTML = html;
  }
  function renderGrid() {
    const items = filtered();
    state.listIds = items.map(i => i.id);

    $('#grid-title').textContent = state.q ? `Results for “${state.q.trim()}”` : label;
    $('#result-count').textContent = state.q ? `${items.length} result${items.length === 1 ? '' : 's'} for “${state.q.trim()}”` : (items.length === 1 ? '1 guide' : `${items.length} guides`);

  /* ---------- viewer ---------- */

  }

  function entryHTML(it, sec, e, n, mark) {
    const key = entryKey(sec, e);

    const body = secs.map(s => `<section class="lp-sec" id="sec-${s.key}" style="--sec:${s.color};--sec-tint:${s.tint}">

        ${s.note ? `<p class="lp-note">${esc(s.note)}</p>` : ''}
        ${s.intro ? `<p class="lp-intro">${esc(s.intro)}</p>` : ''}
        ${s.entries.length ? `<ol class="lp-list">${s.entries.map((e, i) => entryHTML(it, s, e, i + 1, false)).join('')}</ol>`
          : `<p class="lp-empty">${s.accessible ? 'This report has no links in it yet.' : 'This report could not be opened. The link in the source document needs checking.'}</p>`}
        ${s.source ? `<p class="lp-source"><a href="${esc(s.source)}" target="_blank" rel="noopener">Open the full ${esc(s.label)} report${ICON.ext}</a></p>` : ''}
      </section>`).join('');
    return `<div class="links-page">${nav}${savedBlock}${body}</div>`;
  }

  function stageHTML(it) {
    if (it.sections) return linksPageHTML(it);
    const hasRead = !!(it.body && it.body.length);
    const tabs = [];
    if (it.hasVideo || hasRead) tabs.push(['read', it.hasVideo && hasRead ? 'Video and steps' : (it.hasVideo ? 'Video' : 'Read')]);
    if (it.preview) tabs.push(['pdf', 'PDF']);
    if (!tabs.some(t => t[0] === state.stage)) state.stage = tabs.length ? tabs[0][0] : 'none';
    let media;
    if (state.stage === 'pdf') {
      media = `<div class="media"><iframe src="${esc(it.preview)}" title="${esc(it.title)} PDF" allow="fullscreen"></iframe></div>`;
    } else if (state.stage === 'read') {
      media = `<div class="lesson">
        ${it.hasVideo ? `<div class="lesson-video"><iframe src="${esc(it.video)}" title="${esc(it.title)} video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>` : ''}
        ${hasRead ? `<div class="lesson-text">${bodyHTML(it.body)}</div>`
          : `<div class="lesson-text"><p class="lb-p">This lesson is the video above.</p></div>`}
      </div>`;
    } else {
      media = `<div class="media empty"><div><p>Nothing to show for this one yet.</p>
        <a class="btn small" href="${esc(it.url)}" target="_blank" rel="noopener">Open it in the community ${ICON.ext}</a></div></div>`;
    }
    return `${tabs.length > 1 ? `<div class="stage-tabs">${tabs.map(([k, l]) => `<button type="button" data-stage="${k}" aria-pressed="${state.stage === k}">${l}</button>`).join('')}</div>` : ''}
      ${media}
      ${state.stage === 'pdf' ? `<div class="stage-note">If the preview stays blank, use Download PDF at the top.</div>` : ''}`;
  }

  function openGuide(id, push) {
    const it = byId[id]; if (!it) return;
    state.open = id;
    const marked = !!store.bookmarks[id];
    $('#viewer-title').innerHTML = `<span class="swatch" style="${styleVars(it.topic)}">${st(it.topic).icon}</span><span class="t">${titleHTML(it)}</span>`;
    $('#viewer-actions').innerHTML = `
      ${it.hasPdf ? `<a class="btn primary small" href="${esc(it.download)}" target="_blank" rel="noopener">${ICON.download} Download PDF</a>` : ''}
      <button class="icon-btn star" type="button" data-star="${id}" aria-pressed="${marked}" title="${marked ? 'Remove bookmark' : 'Bookmark'}" aria-label="Bookmark">${marked ? ICON.star : ICON.starOutline}</button>`;
    $('#viewer-body').innerHTML = `<div class="stage" id="stage" style="${styleVars(it.topic)}">${stageHTML(it)}</div>`;
    const v = $('#viewer'), scrim = $('#scrim');
    v.hidden = false; scrim.hidden = false;
    requestAnimationFrame(() => { v.classList.add('open'); scrim.classList.add('open'); });
    const idx = state.listIds.indexOf(id);
    $('[data-action="prev"]').disabled = idx <= 0;
    $('[data-action="next"]').disabled = idx < 0 || idx >= state.listIds.length - 1;
    if (push !== false) history.replaceState(null, '', '#guide/' + id);
    document.body.style.overflow = 'hidden';
    setTimeout(() => $('[data-action="close"]')?.focus(), 50);
  }
  function closeViewer() {
    const v = $('#viewer'), scrim = $('#scrim');
    v.classList.remove('open'); scrim.classList.remove('open');
    setTimeout(() => { v.hidden = true; scrim.hidden = true; $('#viewer-body').innerHTML = ''; }, 200);
    state.open = null; state.stage = 'read';
    document.body.style.overflow = '';
    history.replaceState(null, '', location.pathname + location.search);
    refresh();
  }

  /* ---------- actions ---------- */
  /* a saved entry is keyed by its section and a hash of its text, so it survives a rebuild */
  function hash(str) { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
  const entryKey = (sec, e) => sec.key + ':' + hash(e.title + '|' + ((e.links[0] || {}).href || ''));
  const savedMap = id => store.saved[id] || {};
  const savedCount = id => Object.keys(savedMap(id)).length;
  function toggleSave(id, key) {
    const m = store.saved[id] || (store.saved[id] = {});
    if (m[key]) delete m[key]; else m[key] = 1;
    if (!Object.keys(m).length) delete store.saved[id];
    save(); toast(m[key] ? 'Saved' : 'Removed from saved');
    const page = $('.links-page'); const top = page ? page.scrollTop : 0;
    const it = byId[id]; if (it) $('#stage').innerHTML = stageHTML(it);
    const p2 = $('.links-page'); if (p2) p2.scrollTop = top;
    renderTopics(); renderGrid();
  }

  function toggleStar(id) {
    store.bookmarks[id] = !store.bookmarks[id]; if (!store.bookmarks[id]) delete store.bookmarks[id];
    save(); toast(store.bookmarks[id] ? 'Bookmarked' : 'Bookmark removed');
    refresh(); if (state.open === id) syncViewerButtons(id);
  }
  function toggleDone(id) {
    store.done[id] = !store.done[id]; if (!store.done[id]) delete store.done[id];
    save(); toast(store.done[id] ? 'Marked done' : 'Marked not done');
    refresh(); if (state.open === id) syncViewerButtons(id);
  }
  function syncViewerButtons(id) {
    const s = $('#viewer [data-star]'); if (s) { const on = !!store.bookmarks[id]; s.setAttribute('aria-pressed', on); s.innerHTML = on ? ICON.star : ICON.starOutline; s.title = on ? 'Remove bookmark' : 'Bookmark'; }
  }
  let noteTimer;
  function saveNote(id, text) {
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => {
      if (text.trim()) store.notes[id] = text; else delete store.notes[id];
      save();
      const s = $('#saved'); if (s) s.textContent = 'Saved';
      setTimeout(() => { const s2 = $('#saved'); if (s2) s2.textContent = ''; }, 1800);
    }, 400);
  }
  function toggleCheck(id, href, btn) {
    store.checked[id] = store.checked[id] || {};
    store.checked[id][href] = !store.checked[id][href]; if (!store.checked[id][href]) delete store.checked[id][href];
    save();
    const on = !!store.checked[id][href];
    btn.setAttribute('aria-checked', String(on)); btn.closest('li').classList.toggle('checked', on);
  }
  let toastTimer;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1600); }
  function copy(text) { return navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text).then(() => true, () => false) : Promise.resolve(false); }
  function setTab(tab) { state.tab = 'library'; window.scrollTo({ top: 0 }); }
  function refresh() { renderTopics(); renderGrid(); }

  /* ---------- events ---------- */
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-action]');
    if (a) {
      const act = a.dataset.action;
      if (act === 'home') { e.preventDefault(); state.topic = null; setTab('library'); refresh(); }
      if (act === 'close') closeViewer();
      if (act === 'prev' || act === 'next') { const idx = state.listIds.indexOf(state.open); const nid = state.listIds[idx + (act === 'next' ? 1 : -1)]; if (nid) { state.stage = 'read'; openGuide(nid); } }
      return;
    }
    const tp = e.target.closest('[data-topic]'); if (tp) { state.topic = tp.dataset.topic || null; refresh(); return; }
    const sv = e.target.closest('[data-save]');
    if (sv) { e.stopPropagation(); const [id, key] = sv.dataset.save.split('|'); toggleSave(id, key); return; }
    const st_ = e.target.closest('[data-star]'); if (st_) { e.stopPropagation(); toggleStar(st_.dataset.star); return; }
    const dn = e.target.closest('[data-done]'); if (dn) { e.stopPropagation(); toggleDone(dn.dataset.done); return; }
    const jp = e.target.closest('[data-jump]');
    if (jp) { document.getElementById('sec-' + jp.dataset.jump)?.scrollIntoView({ block: 'start', behavior: 'smooth' }); return; }
    const sg = e.target.closest('[data-stage]'); if (sg) { state.stage = sg.dataset.stage; const it = byId[state.open]; if (it) $('#stage').innerHTML = stageHTML(it); return; }
    const ck = e.target.closest('[data-check]'); if (ck) { toggleCheck(state.open, ck.dataset.check, ck); return; }
    const op = e.target.closest('[data-open]'); if (op) { state.stage = 'read'; openGuide(op.dataset.open); return; }
    if (e.target.id === 'scrim') closeViewer();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && state.open) closeViewer();
    if (e.key === '/' && document.activeElement && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); }
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'q') { state.q = e.target.value; $('#q-clear').hidden = !state.q; renderGrid(); }
  });
  $('#q-clear').addEventListener('click', () => { $('#q').value = ''; state.q = ''; $('#q-clear').hidden = true; renderGrid(); $('#q').focus(); });
  window.addEventListener('hashchange', route);
  function route() {
    const m = location.hash.match(/^#guide\/(\d+)$/);
    if (m && byId[m[1]]) { if (!state.listIds.includes(m[1])) { state.topic = null; state.q = ''; $('#q').value = ''; refresh(); } openGuide(m[1], false); }
  }

  /* ---------- boot ---------- */
  if (DATA.library && DATA.library.title) { const w = $('.brand-word'); if (w) w.textContent = DATA.library.title; document.title = 'Lesko Help ' + DATA.library.title; }
  refresh(); route();
})();

</script>
</body>
</html>
